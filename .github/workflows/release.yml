name: Desktop builds

# Builds the double-click desktop app for each platform (see
# packaging/drtbatlas.spec). Pull requests that touch the packaging upload the
# builds as workflow artifacts; pushing a version tag (e.g. 1.4.0) also
# attaches them to a draft GitHub Release for review before publishing.

on:
  push:
    tags:
      - '[0-9]*'
      - 'v[0-9]*'
  pull_request:
    paths:
      - 'launcher.py'
      - 'packaging/**'
      - 'requirements.txt'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
          - os: macos-latest
            platform: macos-arm64
          - os: macos-15-intel
            platform: macos-x64
          # The oldest supported runner, so the binary runs on older glibc.
          - os: ubuntu-22.04
            platform: linux-x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'dev' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Tk (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libtk8.6

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r packaging/requirements-build.txt
          python -c "import tkinter"

      - name: Build
        run: pyinstaller --noconfirm packaging/drtbatlas.spec

      - name: Smoke test
        env:
          BROWSER: 'true'
        run: |
          case "$RUNNER_OS" in
            macOS)   exe="dist/DR-TBAtlas.app/Contents/MacOS/DR-TBAtlas" ;;
            Windows) exe="dist/DR-TBAtlas/DR-TBAtlas.exe" ;;
            *)       exe="dist/DR-TBAtlas/DR-TBAtlas" ;;
          esac
          "$exe" &
          pid=$!
          for i in $(seq 1 120); do
            curl -sf -o /dev/null http://127.0.0.1:8050/ && break
            sleep 1
          done
          curl -sf -o /dev/null http://127.0.0.1:8050/
          curl -sf -o /dev/null http://127.0.0.1:8050/data/tracks/search_meta.json
          curl -sf -o /dev/null http://127.0.0.1:8050/_dash-component-suites/dash_jbrowse/dash_jbrowse.min.js
          echo "Started and served in ${i}s"
          kill "$pid" || true
          if [ "$RUNNER_OS" = Windows ]; then taskkill //F //IM DR-TBAtlas.exe || true; fi

      - name: Package
        run: |
          name="DR-TBAtlas-${VERSION}-${{ matrix.platform }}"
          case "$RUNNER_OS" in
            macOS)   ditto -c -k --keepParent dist/DR-TBAtlas.app "$name.zip" ;;
            Windows) (cd dist && 7z a -tzip "../$name.zip" DR-TBAtlas >/dev/null) ;;
            *)       tar -czf "$name.tar.gz" -C dist DR-TBAtlas ;;
          esac
          ls -lh DR-TBAtlas-*

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: DR-TBAtlas-${{ matrix.platform }}
          path: |
            DR-TBAtlas-*.zip
            DR-TBAtlas-*.tar.gz
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download builds
        uses: actions/download-artifact@v4
        with:
          path: builds
          merge-multiple: true

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          body_path: packaging/release-notes.md
          files: builds/*
